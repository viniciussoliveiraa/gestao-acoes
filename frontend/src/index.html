<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gestão de Ações</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      // Aplica o modo escuro antes do primeiro desenho da página (evita "piscar" branco).
      // Mesma regra do TemaService: escolha salva > preferência do sistema.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('gestao-acoes.tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        if (tema === 'escuro') {
          document.documentElement.classList.add('tema-escuro');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
