<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <div class="shell__brand-icon">
        <mat-icon>show_chart</mat-icon>
      </div>
      <div>
        <div class="shell__brand-title">Gestão de Ações</div>
        <div class="shell__brand-subtitle">Painel do investidor</div>
      </div>
    </div>

    <nav class="shell__nav">
      <span class="shell__nav-label">Carteira</span>
      <mat-nav-list>
        <a mat-list-item routerLink="/resumo" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Resumo</span>
        </a>
        <a mat-list-item routerLink="/lancamentos" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>receipt_long</mat-icon>
          <span matListItemTitle>Lançamentos</span>
        </a>
        <a mat-list-item routerLink="/proventos" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>payments</mat-icon>
          <span matListItemTitle>Proventos</span>
        </a>
        <a mat-list-item routerLink="/graficos" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>pie_chart</mat-icon>
          <span matListItemTitle>Gráficos</span>
        </a>
        <a mat-list-item routerLink="/rebalanceamento" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>balance</mat-icon>
          <span matListItemTitle>Rebalanceamento</span>
        </a>
      </mat-nav-list>

      <span class="shell__nav-label">Cadastros</span>
      <mat-nav-list>
        <a mat-list-item routerLink="/corretoras" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>account_balance</mat-icon>
          <span matListItemTitle>Corretoras</span>
        </a>
        <a mat-list-item routerLink="/acoes" routerLinkActive="shell__link--active">
          <mat-icon matListItemIcon>trending_up</mat-icon>
          <span matListItemTitle>Ações</span>
        </a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="shell__body">
    <mat-toolbar class="shell__toolbar">
      <span class="shell__spacer"></span>
      @if (authService.autenticado()) {
        <button mat-stroked-button class="shell__logout" (click)="sair()">
          <mat-icon>logout</mat-icon>
          Sair
        </button>
      } @else {
        <a mat-flat-button color="primary" routerLink="/login">Entrar</a>
      }
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
