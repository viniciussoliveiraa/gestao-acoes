server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA com roteamento client-side (Angular Router): qualquer rota
    # desconhecida cai no index.html para o Router decidir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|js\.map|css\.map|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
