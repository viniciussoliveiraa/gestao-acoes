# /acoes, /corretoras e /proventos sao ao mesmo tempo paths da API e rotas de
# pagina do Angular. Uma navegacao de pagina de verdade (digitar a URL, dar F5,
# abrir um favorito) manda "Accept: text/html,..."; ja as chamadas da propria
# SPA a API (HttpClient/fetch) mandam "Accept: application/json, text/plain, */*"
# - sem text/html. Usamos isso para decidir entre servir o index.html (SPA) ou
# proxiar para o backend, sem os dois lados colidirem.
map $http_accept $eh_navegacao_de_pagina {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API: front e back atras da mesma porta publicada.
    # "aplicacao" e o hostname do servico Spring Boot na rede do Compose;
    # o servico nao publica porta propria no host.
    location ~ ^/(auth|acoes|carteira|corretoras|proventos|actuator|swagger-ui|v3/api-docs)(/|$) {
        if ($eh_navegacao_de_pagina) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://aplicacao:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA com roteamento client-side (Angular Router): qualquer rota
    # desconhecida cai no index.html para o Router decidir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|js\.map|css\.map|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
