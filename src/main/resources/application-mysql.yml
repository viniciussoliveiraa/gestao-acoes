spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gestao_acoes}
    username: ${SPRING_DATASOURCE_USERNAME:gestao_acoes}
    password: ${SPRING_DATASOURCE_PASSWORD:gestao_acoes}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
