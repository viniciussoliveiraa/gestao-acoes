# Aula 15, seção 20: o CI executa exatamente o mesmo comando usado localmente
# (./mvnw clean verify), então testes + portão JaCoCo valem igual para todos.
name: testes

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # o mvnw está versionado sem o bit de execução (repositório criado no Windows)
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
