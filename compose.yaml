name: gestao-acoes

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_acoes}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-gestao_acoes}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-gestao_acoes} -d ${POSTGRES_DB:-gestao_acoes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  aplicacao:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestao-acoes:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Dentro da rede do Compose o banco e acessado pelo hostname "postgres", nao "localhost".
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestao_acoes}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-gestao_acoes}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-120}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_MARKET_DATA_US_PROVIDER: ${APP_MARKET_DATA_US_PROVIDER:-twelve-data}
      BRASIL_API_BASE_URL: ${BRASIL_API_BASE_URL:-https://brasilapi.com.br/api}
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br/ws}
      BRAPI_BASE_URL: ${BRAPI_BASE_URL:-https://brapi.dev}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      TWELVE_DATA_BASE_URL: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    # Sem porta publicada no host: o servico so e acessado via rede interna do
    # Compose (hostname "aplicacao"), atras do proxy reverso do frontend.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gestao-acoes-frontend:local
    restart: unless-stopped
    depends_on:
      - aplicacao
    ports:
      # Unica porta publicada: serve o Angular e faz proxy da API, tudo junto.
      - "${APP_PORT:-8080}:80"

volumes:
  postgres_data:
